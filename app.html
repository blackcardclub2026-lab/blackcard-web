<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Black Card</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/logo.png">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Black Card">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

  :root {
    --ink: #0a0908;
    --panel: #131110;
    --panel-2: #1a1714;
    --hairline: rgba(201, 162, 39, 0.18);
    --gold: #c9a227;
    --gold-bright: #e9c96a;
    --gold-dim: #8a6f22;
    --paper: #f3ead0;
    --muted: #8a8478;
    --err: #b5533f;
    --ok: #4f9d6e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
  }

  body {
    background:
      linear-gradient(180deg, rgba(10,9,8,0.6) 0%, rgba(10,9,8,0.85) 40%, var(--ink) 80%),
      url('assets/background.jpg') center top / cover no-repeat fixed,
      var(--ink);
  }

  .stage {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 96px;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 2px 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 34px; height: 34px; object-fit: contain; }
  .brand span { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 19px; letter-spacing: 0.02em; color: var(--gold-bright); }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    border: 1px solid var(--hairline); border-radius: 20px; padding: 7px 14px;
    cursor: pointer; background: var(--panel);
  }

  h1.page-title {
    font-family: 'Cormorant Garamond', serif; font-weight: 700;
    font-size: 26px; margin: 0 0 18px; color: var(--paper);
  }

  /* ---------- cards ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 16px;
  }
  .card + .card { margin-top: 14px; }

  .section-label {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold-dim); margin: 22px 2px 10px;
  }
  .section-label:first-of-type { margin-top: 0; }

  /* ---------- pills / tabs ---------- */
  .tabs {
    display: flex; gap: 8px; background: var(--panel);
    border: 1px solid var(--hairline); border-radius: 24px; padding: 4px; margin-bottom: 16px;
  }
  .tabs a, .tabs button {
    flex: 1; text-align: center; padding: 10px 8px; border-radius: 20px;
    font-size: 13px; font-weight: 600; color: var(--muted);
    border: none; background: transparent; cursor: pointer; font-family: inherit;
  }
  .tabs a.active, .tabs button.active { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: #1a1400; }

  /* ---------- tournament card ---------- */
  .t-card { display: block; overflow: hidden; margin-bottom: 16px; }
  .t-hero {
    padding: 22px 18px 16px; text-align: center;
    background: radial-gradient(120% 100% at 50% 0%, rgba(201,162,39,0.14), transparent 60%);
  }
  .t-hero .eyebrow { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; }
  .t-hero h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; margin: 0; color: var(--paper); }
  .t-hero .sub { font-size: 12px; color: var(--gold-bright); font-style: italic; margin-top: 4px; }
  .t-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-top: 1px solid var(--hairline); padding: 12px 16px;
  }
  .t-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; border: 1px solid var(--hairline); border-radius: 20px;
    padding: 5px 10px; color: var(--paper); background: var(--panel-2);
  }
  .btn {
    border: none; border-radius: 20px; padding: 9px 16px;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12.5px;
    letter-spacing: 0.03em; text-transform: uppercase; color: #1a1400; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    box-shadow: 0 6px 18px rgba(201,162,39,0.18);
    white-space: nowrap;
  }
  .btn.full { width: 100%; padding: 15px; font-size: 14px; margin-top: 4px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: var(--panel-2); color: var(--paper); border: 1px solid var(--hairline); box-shadow: none; }

  /* ---------- key/value rows ---------- */
  .kv-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .kv-row:last-child { border-bottom: none; }
  .kv-row .k { color: var(--muted); }
  .kv-row .v { color: var(--paper); font-weight: 600; text-align: right; }

  /* ---------- participants table ---------- */
  .p-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .p-row:last-child { border-bottom: none; }
  .p-row .rank { width: 22px; color: var(--gold-dim); font-weight: 700; }
  .p-row .nick { flex: 1; color: var(--paper); }
  .p-row .pts { color: var(--gold-bright); font-weight: 700; }

  /* ---------- profile ---------- */
  .profile-head { display: flex; align-items: center; gap: 14px; }
  .avatar {
    width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold-bright);
    background: var(--panel-2); flex-shrink: 0;
  }
  .profile-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--paper); }
  .profile-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat-tile { text-align: center; border: 1px solid var(--hairline); border-radius: 10px; padding: 12px 6px; }
  .stat-tile .num { font-size: 19px; font-weight: 700; color: var(--gold-bright); }
  .stat-tile .lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }

  /* ---------- achievements ---------- */
  .ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ach-tile {
    border: 1px solid var(--hairline); border-radius: 10px; padding: 12px; text-align: center;
    opacity: 0.4;
  }
  .ach-tile.earned { opacity: 1; border-color: var(--gold); background: rgba(201,162,39,0.06); }
  .ach-tile .title { font-size: 12.5px; font-weight: 700; color: var(--paper); margin-bottom: 4px; }
  .ach-tile .desc { font-size: 10.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(10,9,8,0.96), rgba(10,9,8,0.7));
    backdrop-filter: blur(6px);
    z-index: 40;
  }
  .bottom-nav .inner {
    display: flex; gap: 6px; max-width: 460px; width: 100%;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 26px; padding: 6px;
  }
  .bottom-nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0; border-radius: 20px; font-size: 10.5px; color: var(--muted);
  }
  .bottom-nav a.active { color: #1a1400; background: linear-gradient(180deg, var(--gold-bright), var(--gold)); }
  .bottom-nav svg { width: 18px; height: 18px; }

  .empty-note { color: var(--muted); font-size: 13.5px; text-align: center; padding: 30px 10px; line-height: 1.6; }
  .loading { color: var(--muted); font-size: 13.5px; text-align: center; padding: 30px 10px; }

  .badge-ok { color: var(--ok); font-weight: 700; }

  /* ---------- register (перенесено из старого index.html) ---------- */
  .reg-field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .reg-field label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); }
  .reg-field input[type="text"], .reg-field input[type="date"] {
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 15px 14px; font-size: 16px; color: var(--paper); font-family: 'Manrope', sans-serif;
    outline: none; width: 100%; color-scheme: dark;
  }
  .reg-field.invalid input { border-color: var(--err); }
  .reg-field .hint { font-size: 12px; color: var(--err); min-height: 14px; display: none; }
  .reg-field.invalid .hint { display: block; }
  .consent { display: flex; align-items: flex-start; gap: 10px; background: var(--panel); border: 1px solid var(--hairline); border-radius: 4px; padding: 13px 14px; cursor: pointer; margin-bottom: 16px; }
  .consent input[type="checkbox"] { width: 19px; height: 19px; min-width: 19px; margin-top: 1px; }
  .consent .consent-text { font-size: 13px; line-height: 1.5; color: var(--paper); }
  .consent.invalid { border-color: var(--err); }
  .success-box { text-align: center; padding: 40px 20px; }
  .success-box .seal { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .success-box h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; margin: 0 0 10px; color: var(--gold-bright); }
  .success-box p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="bottom-nav">
  <div class="inner" id="bottom-nav-inner"></div>
</div>

<script>
/* ============ конфиг ============ */
// [Предположение] заменить на реальный адрес backend после деплоя на Railway
const API_BASE = window.BLACKCARD_API_BASE || "https://web-production-9c197.up.railway.app";

/* ============ авторизация (email + пароль, отдельно от Telegram) ============ */
function getToken() { try { return localStorage.getItem("bc_token") || ""; } catch(e) { return ""; } }
function setToken(t) { try { if (t) localStorage.setItem("bc_token", t); else localStorage.removeItem("bc_token"); } catch(e) {} }
function isAuthed() { return !!getToken(); }

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const token = getToken();
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  if (res.status === 401 && token) { setToken(""); }
  if (!res.ok) throw new Error((await res.json().catch(()=>({detail:res.statusText}))).detail || res.statusText);
  return res.json();
}

/* ============ роутер ============ */
const PUBLIC_ROUTES = new Set(["/login", "/signup"]);
const routes = {};
function route(pattern, handler) { routes[pattern] = handler; }
function navigate(hash) { location.hash = hash; }

async function router() {
  const hash = location.hash.slice(1) || "/home";
  const [path, queryStr] = hash.split("?");
  const query = Object.fromEntries(new URLSearchParams(queryStr || ""));

  if (!isAuthed() && !PUBLIC_ROUTES.has(path)) {
    location.hash = "#/login";
    return;
  }

  renderBottomNav(path);
  const stage = document.getElementById("stage");
  stage.innerHTML = '<div class="loading">Загрузка…</div>';

  for (const pattern in routes) {
    const m = matchRoute(pattern, path);
    if (m) {
      try { await routes[pattern](stage, m, query); }
      catch (e) { stage.innerHTML = `<div class="empty-note">Ошибка: ${escapeHtml(e.message || String(e))}</div>`; }
      window.scrollTo(0,0);
      return;
    }
  }
  stage.innerHTML = '<div class="empty-note">Страница не найдена</div>';
}
function matchRoute(pattern, path) {
  const pParts = pattern.split("/").filter(Boolean);
  const aParts = path.split("/").filter(Boolean);
  if (pParts.length !== aParts.length) return null;
  const params = {};
  for (let i = 0; i < pParts.length; i++) {
    if (pParts[i].startsWith(":")) params[pParts[i].slice(1)] = aParts[i];
    else if (pParts[i] !== aParts[i]) return null;
  }
  return params;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function topbar(title, backTo) {
  return `<div class="topbar">
    <div class="brand"><img src="assets/logo.png" alt=""><span>Black Card</span></div>
    ${backTo ? `<a class="back-btn" href="#${backTo}">← Назад</a>` : ""}
  </div>${title ? `<h1 class="page-title">${title}</h1>` : ""}`;
}

/* ============ нижняя навигация ============ */
function renderBottomNav(path) {
  const nav = document.querySelector(".bottom-nav");
  if (PUBLIC_ROUTES.has(path)) { nav.style.display = "none"; return; }
  nav.style.display = "flex";
  const items = [
    { href: "#/home", label: "Главная", key: "/home", icon: `<path d="M4 11L12 4l8 7M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>` },
    { href: "#/tournaments", label: "Турниры", key: "/tournaments", icon: `<path d="M8 4h8v4a4 4 0 01-8 0V4z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 12v4m-3 4h6" stroke="currentColor" stroke-width="1.6"/><path d="M4 6h4M16 6h4" stroke="currentColor" stroke-width="1.6"/>` },
    { href: "#/profile", label: "Профиль", key: "/profile", icon: `<circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M5 20c1.6-3.6 4.4-5.4 7-5.4s5.4 1.8 7 5.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>` },
  ];
  const isActive = (key) => path === key || (key !== "/home" && path.startsWith(key));
  document.getElementById("bottom-nav-inner").innerHTML = items.map(it =>
    `<a href="${it.href}" class="${isActive(it.key) ? 'active' : ''}"><svg viewBox="0 0 24 24">${it.icon}</svg>${it.label}</a>`
  ).join("");
}

/* ============ страницы ============ */

// ---- Главная ----
route("/home", async (stage) => {
  const [clubs, tournaments, me] = await Promise.all([
    api("/api/clubs"),
    api("/api/tournaments?sort=soon"),
    api("/api/me"),
  ]);
  const next = tournaments[0];

  stage.innerHTML = `
    ${topbar()}
    <div class="card profile-head">
      <div class="avatar">${(me?.nickname || "?")[0].toUpperCase()}</div>
      <div>
        <div class="profile-name">${escapeHtml(me?.nickname || "Гость")}</div>
        <div class="profile-sub">Сыграно турниров: ${me.played}</div>
      </div>
    </div>

    <div class="section-label">Ближайший турнир</div>
    ${next ? tournamentCard(next) : `<div class="empty-note">Пока нет запланированных турниров.</div>`}

    <div class="section-label">Клуб</div>
    <div class="card">
      ${clubs.map(c => `<div class="kv-row"><span class="k">${escapeHtml(c.name)}</span><span class="v">${escapeHtml(c.city)}, ${escapeHtml(c.address)}</span></div>`).join("")}
    </div>
  `;
});

// ---- Список турниров ----
route("/tournaments", async (stage, params, query) => {
  const clubs = await api("/api/clubs");
  const activeClub = query.club ? Number(query.club) : (clubs[0]?.id);
  const sort = query.sort || "soon";
  const tournaments = await api(`/api/tournaments?club_id=${activeClub}&sort=${sort}`);

  stage.innerHTML = `
    ${topbar("Турниры")}
    <div class="tabs">
      ${clubs.map(c => `<a href="#/tournaments?club=${c.id}&sort=${sort}" class="${c.id === activeClub ? 'active' : ''}">${escapeHtml(c.name)}</a>`).join("")}
    </div>
    <div id="list">
      ${tournaments.length ? tournaments.map(tournamentCard).join("") : `<div class="empty-note">На этот филиал турниров пока нет.</div>`}
    </div>
  `;
});

function tournamentCard(t) {
  const full = t.free_spots <= 0;
  return `
    <a class="card t-card" href="#/tournaments/${t.id}">
      <div class="t-hero">
        <div class="eyebrow">Black Card</div>
        <h2>${escapeHtml(t.title)}</h2>
        ${t.subtitle ? `<div class="sub">${escapeHtml(t.subtitle)}</div>` : ""}
      </div>
      <div class="t-meta">
        <div class="t-chips">
          <span class="chip">${formatDate(t.date)}</span>
          <span class="chip">${t.start_time}</span>
          <span class="chip">${full ? "мест нет" : t.registered + "/" + t.capacity}</span>
        </div>
        <span class="btn">${full ? "Список ожидания" : "Записаться"}</span>
      </div>
    </a>`;
}
function formatDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
}

// ---- Детальная страница турнира ----
route("/tournaments/:id", async (stage, params) => {
  const id = params.id;
  const tab = new URLSearchParams(location.hash.split("?")[1] || "").get("tab") || "about";
  const t = await api(`/api/tournaments/${id}`);
  const full = t.free_spots <= 0;

  stage.innerHTML = `
    ${topbar(null, "/tournaments")}
    <div class="card" style="padding:0; overflow:hidden;">
      <div class="t-hero">
        <div class="eyebrow">Black Card</div>
        <h2>${escapeHtml(t.title)}</h2>
        ${t.subtitle ? `<div class="sub">${escapeHtml(t.subtitle)}</div>` : ""}
      </div>
      <div class="t-meta">
        <div class="t-chips">
          <span class="chip">${formatDate(t.date)}</span>
          <span class="chip">${t.start_time}</span>
          <span class="chip">${t.registered}/${t.capacity}</span>
        </div>
      </div>
    </div>

    <div class="tabs" style="margin-top:16px;">
      <a href="#/tournaments/${id}?tab=about" class="${tab === 'about' ? 'active' : ''}">О мероприятии</a>
      <a href="#/tournaments/${id}?tab=participants" class="${tab === 'participants' ? 'active' : ''}">Участники</a>
    </div>

    <div id="tab-content"></div>
    <button class="btn full" id="reg-btn">${full ? "В список ожидания" : "Записаться"}</button>
  `;

  const content = document.getElementById("tab-content");
  if (tab === "about") {
    content.innerHTML = `
      <div class="section-label">Дата и расположение</div>
      <div class="card">
        <div class="kv-row"><span class="k">Клуб</span><span class="v">${escapeHtml(t.club.name)}</span></div>
        <div class="kv-row"><span class="k">Город</span><span class="v">${escapeHtml(t.club.city)}</span></div>
        <div class="kv-row"><span class="k">Адрес</span><span class="v">${escapeHtml(t.club.address)}</span></div>
        <div class="kv-row"><span class="k">Дата</span><span class="v">${formatDate(t.date)}</span></div>
        <div class="kv-row"><span class="k">Время</span><span class="v">${t.start_time}</span></div>
        <div class="kv-row"><span class="k">Свободных мест</span><span class="v">${t.free_spots} из ${t.capacity}</span></div>
      </div>
      ${t.description ? `<div class="section-label">Описание формата</div><div class="card">${escapeHtml(t.description)}</div>` : ""}
      <div class="section-label">Особенности</div>
      <div class="card">
        <div class="kv-row"><span class="k">Стоимость</span><span class="v">${t.cost.toLocaleString("ru-RU")} сум</span></div>
        <div class="kv-row"><span class="k">Стартовый стек</span><span class="v">${t.starting_stack.toLocaleString("ru-RU")}</span></div>
        ${t.rebuy_cost ? `<div class="kv-row"><span class="k">Повторный вход</span><span class="v">${t.rebuy_cost.toLocaleString("ru-RU")} сум</span></div>` : ""}
        ${t.late_reg_until ? `<div class="kv-row"><span class="k">Поздняя регистрация</span><span class="v">до ${t.late_reg_until}</span></div>` : ""}
      </div>
    `;
  } else {
    const participants = await api(`/api/tournaments/${id}/participants`);
    content.innerHTML = `
      <div class="section-label">Зарегистрировано ${t.registered} / ${t.capacity}</div>
      <div class="card">
        ${participants.length ? participants.map((p, i) => `
          <div class="p-row"><span class="rank">${i+1}</span><span class="nick">${escapeHtml(p.nickname)}</span><span class="pts">${p.points}</span></div>
        `).join("") : `<div class="empty-note">Пока никто не записался.</div>`}
      </div>
    `;
  }

  document.getElementById("reg-btn").addEventListener("click", async (e) => {
    e.target.disabled = true;
    try {
      const r = await api(`/api/tournaments/${id}/register`, { method: "POST" });
      e.target.textContent = r.status === "waitlist" ? "Вы в списке ожидания" : "Вы записаны";
    } catch (err) {
      alert(err.message);
      e.target.disabled = false;
    }
  });
});

// ---- Профиль ----
route("/profile", async (stage) => {
  const me = await api("/api/me");
  stage.innerHTML = `
    ${topbar("Профиль")}
    <div class="card profile-head">
      <div class="avatar">${(me.nickname || "?")[0].toUpperCase()}</div>
      <div>
        <div class="profile-name">${escapeHtml(me.nickname)}</div>
        <div class="profile-sub">${escapeHtml(me.email)}</div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-tile"><div class="num">${me.played}</div><div class="lbl">Игр сыграно</div></div>
      <div class="stat-tile"><div class="num">${me.followers}</div><div class="lbl">Подписчики</div></div>
      <div class="stat-tile"><div class="num">${me.following}</div><div class="lbl">Подписки</div></div>
    </div>
    <div class="section-label">Разделы</div>
    <div class="card" style="padding:0;">
      <a href="#/achievements" class="kv-row" style="padding:14px 16px;"><span class="k">Достижения</span><span class="v">→</span></a>
      <a href="#/rating" class="kv-row" style="padding:14px 16px;"><span class="k">Лидерборд</span><span class="v">→</span></a>
    </div>
    <button class="btn ghost full" id="logout-btn" style="margin-top:16px;">Выйти</button>
  `;
  document.getElementById("logout-btn").addEventListener("click", () => {
    setToken("");
    navigate("#/login");
  });
});

// ---- Лидерборд ----
route("/rating", async (stage, params, query) => {
  const clubs = await api("/api/clubs");
  const activeClub = query.club ? Number(query.club) : (clubs[0]?.id);
  const rows = await api(`/api/rating?club_id=${activeClub}`);
  stage.innerHTML = `
    ${topbar("Лидерборд", "/profile")}
    <div class="tabs">
      ${clubs.map(c => `<a href="#/rating?club=${c.id}" class="${c.id === activeClub ? 'active' : ''}">${escapeHtml(c.name)}</a>`).join("")}
    </div>
    <div class="card">
      ${rows.length ? rows.map((r, i) => `
        <div class="p-row"><span class="rank">${i+1}</span><span class="nick">${escapeHtml(r.nickname)}</span><span class="pts">${r.points}</span></div>
      `).join("") : `<div class="empty-note">Пока нет данных за этот месяц.</div>`}
    </div>
  `;
});

// ---- Достижения ----
route("/achievements", async (stage) => {
  const items = await api("/api/achievements");
  const earned = items.filter(a => a.earned).length;
  stage.innerHTML = `
    ${topbar("Достижения", "/profile")}
    <div class="section-label">${earned} / ${items.length} получено</div>
    <div class="ach-grid">
      ${items.map(a => `
        <div class="ach-tile ${a.earned ? 'earned' : ''}">
          <div class="title">${escapeHtml(a.title)}</div>
          <div class="desc">${escapeHtml(a.description)}</div>
        </div>
      `).join("")}
    </div>
  `;
});

// ---- Вход ----
route("/login", async (stage) => {
  stage.innerHTML = `
    <div class="emblem-wrap-plain" style="display:flex; flex-direction:column; align-items:center; padding:32px 0 24px;">
      <img src="assets/logo.png" alt="" style="width:150px; max-width:60%;">
    </div>
    <h1 class="page-title" style="text-align:center;">Вход</h1>

    <div class="reg-field" id="email-field">
      <label for="login-email">Email</label>
      <input type="text" id="login-email" placeholder="you@example.com" autocomplete="email">
      <div class="hint">Введите email</div>
    </div>
    <div class="reg-field" id="password-field">
      <label for="login-password">Пароль</label>
      <input type="text" id="login-password" placeholder="••••••••" autocomplete="current-password" style="-webkit-text-security:disc; text-security:disc;">
      <div class="hint">Введите пароль</div>
    </div>

    <button class="btn full" id="login-submit">Войти</button>
    <p style="text-align:center; font-size:13px; color:var(--muted); margin-top:18px;">
      Нет аккаунта? <a href="#/signup" style="color:var(--gold-bright); text-decoration:underline;">Зарегистрироваться</a>
    </p>
  `;

  document.getElementById("login-submit").addEventListener("click", async () => {
    const emailField = document.getElementById("email-field");
    const passField = document.getElementById("password-field");
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    let ok = true;
    if (!email) { emailField.classList.add("invalid"); ok = false; } else emailField.classList.remove("invalid");
    if (!password) { passField.classList.add("invalid"); ok = false; } else passField.classList.remove("invalid");
    if (!ok) return;

    const btn = document.getElementById("login-submit");
    btn.disabled = true;
    try {
      const r = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
      setToken(r.token);
      navigate("#/home");
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
    }
  });
});

// ---- Регистрация аккаунта (замена старой формы гостя + gspread) ----
route("/signup", async (stage) => {
  stage.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; padding:32px 0 24px;">
      <img src="assets/logo.png" alt="" style="width:150px; max-width:60%;">
    </div>
    <div id="reg-form-wrap">
      <h1 class="page-title" style="text-align:center;">Регистрация</h1>
      <p style="text-align:center; color:var(--muted); font-size:14px; margin:-10px 0 24px;">Создайте аккаунт Black Card, чтобы записываться на турниры.</p>

      <div class="reg-field" id="name-field">
        <label for="reg-name">Никнейм</label>
        <input type="text" id="reg-name" placeholder="Например, BlackAce" autocomplete="off">
        <div class="hint">Введите никнейм, минимум 2 символа</div>
      </div>

      <div class="reg-field" id="email-field">
        <label for="reg-email">Email</label>
        <input type="text" id="reg-email" placeholder="you@example.com" autocomplete="email">
        <div class="hint">Введите корректный email</div>
      </div>

      <div class="reg-field" id="password-field">
        <label for="reg-password">Пароль</label>
        <input type="text" id="reg-password" placeholder="Минимум 6 символов" autocomplete="new-password" style="-webkit-text-security:disc; text-security:disc;">
        <div class="hint">Минимум 6 символов</div>
      </div>

      <label class="consent" id="consent-field">
        <input type="checkbox" id="reg-consent">
        <span class="consent-text">Я согласен(на) с <a href="#" id="rules-link">правилами клуба</a></span>
      </label>

      <button class="btn full" id="reg-submit">Зарегистрироваться</button>
      <p style="text-align:center; font-size:13px; color:var(--muted); margin-top:18px;">
        Уже есть аккаунт? <a href="#/login" style="color:var(--gold-bright); text-decoration:underline;">Войти</a>
      </p>
    </div>
    <div id="reg-success" style="display:none;" class="success-box">
      <div class="seal"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#e9c96a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2>Готово</h2>
      <p>Аккаунт создан. Переходим в приложение…</p>
    </div>
  `;

  document.getElementById("rules-link").addEventListener("click", (e) => { e.preventDefault(); alert("Правила клуба: покер только в развлекательных целях, денежные ставки и выигрыши запрещены."); });

  document.getElementById("reg-submit").addEventListener("click", async () => {
    const nameField = document.getElementById("name-field");
    const nameInput = document.getElementById("reg-name");
    const emailField = document.getElementById("email-field");
    const emailInput = document.getElementById("reg-email");
    const passwordField = document.getElementById("password-field");
    const passwordInput = document.getElementById("reg-password");
    const consentField = document.getElementById("consent-field");
    const consentCheck = document.getElementById("reg-consent");
    let ok = true;

    if (nameInput.value.trim().length < 2) { nameField.classList.add("invalid"); ok = false; } else nameField.classList.remove("invalid");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailInput.value.trim())) { emailField.classList.add("invalid"); ok = false; } else emailField.classList.remove("invalid");
    if (passwordInput.value.length < 6) { passwordField.classList.add("invalid"); ok = false; } else passwordField.classList.remove("invalid");
    if (!consentCheck.checked) { consentField.classList.add("invalid"); ok = false; } else consentField.classList.remove("invalid");
    if (!ok) return;

    const btn = document.getElementById("reg-submit");
    btn.disabled = true;
    try {
      const r = await api("/api/auth/register", {
        method: "POST",
        body: JSON.stringify({
          nickname: nameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value,
          consent_rules: true,
        }),
      });
      setToken(r.token);
      document.getElementById("reg-form-wrap").style.display = "none";
      document.getElementById("reg-success").style.display = "block";
      setTimeout(() => navigate("#/home"), 900);
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
    }
  });
});

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
